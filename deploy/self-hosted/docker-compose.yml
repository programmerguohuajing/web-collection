# D4 白标 · docker-compose 一键自托管部署（PostgreSQL + API 控制台同源）
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: web-collection-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web_eys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_eys"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: web-collection:latest
    container_name: web-collection-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/web_eys
      ADMIN_API_KEY: change-me-in-prod
      CORS_ORIGIN: "*"
      WEB_DIST: /app/apps/web/dist
      SDK_DIST: /app/packages/sdk/dist
      # ---- 白标出厂预置（可选）----
      BRAND_NAME: "Web Collection"
      BRAND_SHORT_NAME: "YC"
      BRAND_PRIMARY_COLOR: "#4f46e5"
      BRAND_LOGIN_SUBTITLE: "前端遥测平台"

volumes:
  pgdata:
