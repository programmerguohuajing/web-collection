apiVersion: v1
kind: Secret
metadata:
  name: web-collection-secret
  namespace: default
  labels:
    app.kubernetes.io/name: web-collection
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # 数据库连接串（支持 PostgreSQL）
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/web_eys"
  # 管理端 API 密钥
  ADMIN_API_KEY: "change-me-in-production-secret-key"
  # JWT 密钥（账号体系开启时使用）
  ACCOUNTS_JWT_SECRET: "your-jwt-secret-key-change-me"
  # 公开采集 Token（可选，默认为空放行）
  COLLECT_TOKEN: ""
