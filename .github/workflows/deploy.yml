name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-collection-cloudflare
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # needed for Cloudflare OIDC authentication

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run tests
        run: pnpm --filter @web-collection/sdk test

      - name: Build for Cloudflare
        run: pnpm build:cloudflare

      # D1 免费版每日行读有硬上限（code 7500）；大表建索引还可能超时（code 7429）。
      # 迁移失败（配额耗尽/超时）不应阻塞主 worker 上线——worker 部署本身不读 D1。
      # 迁移会在配额恢复后的某次运行自动补齐；如需立即强制，可本机执行
      # `pnpm exec wrangler d1 migrations apply web-collection --remote`。
      - name: Apply D1 migrations
        continue-on-error: true
        run: pnpm exec wrangler d1 migrations apply web-collection --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # AI worker 需要 Vectorize 索引「ai-kb」+ Workers AI 绑定 + 模型供应商 Secrets 才可部署。
      # 首次部署若这些尚未创建会失败，这里 continue-on-error 避免阻塞主 worker 的关键路径；
      # 缺失时会以 warning 呈现，补齐后重跑即可。
      - name: Deploy AI Worker
        continue-on-error: true
        run: pnpm exec wrangler deploy --config cloudflare/ai-wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 主 worker 通过 AI_WORKER_URL 代理 /api/ai/* 到 ai-worker。
      # 在仓库 Settings → Secrets and variables → Actions → Variables 配置 AI_WORKER_URL，
      # 值为 ai-worker 的 URL（如 https://web-collection-ai.<subdomain>.workers.dev）。
      - name: Set AI worker URL on main worker
        if: vars.AI_WORKER_URL != ''
        run: echo "${{ vars.AI_WORKER_URL }}" | pnpm exec wrangler secret put AI_WORKER_URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # MCP 服务（apps/mcp）：独立 worker web-collection-mcp，与主/ai worker 三独立部署。
      # 数据源默认 rest（包装现有 /api/*），运行时经 MCP_DATASOURCE_KIND 可切到 d1 直连。
      - name: Deploy MCP Worker
        run: pnpm exec wrangler deploy --config apps/mcp/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # MCP 鉴权采用「调用时采集秘钥」模型：客户端在 Authorization: Bearer 中携带目标应用的
      # 采集秘钥，MCP worker 用生产 D1 库校验 sha256 并解析 app_id 后锁定。整个流程不依赖任何
      # 部署期密钥，因此无需 `wrangler secret put`，CI 也不需要在仓库 Secrets 中配置 MCP_*。
      # （MCP worker 的 D1 绑定与 MCP_DATASOURCE_KIND 等均已写在 wrangler.jsonc 的 vars 中。）
      - name: Verify MCP Worker has no required secrets
        run: |
          echo "MCP 鉴权改为调用时采集秘钥模型，部署无需任何 Secrets（MCP_API_KEY / MCP_AUTH_TOKEN 已废弃）。"
          echo "如需本地调试密钥，可在 apps/mcp/.dev.vars 中设置，不影响 CI。"
