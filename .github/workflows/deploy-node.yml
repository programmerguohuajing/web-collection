name: Deploy Node (Linux self-hosted)

# Node + PostgreSQL 后端（apps/api）部署到 Linux self-hosted runner。
# 与部署 Cloudflare Worker 的 deploy.yml 解耦：本工作流负责 Linux/云服务器路径，
# deploy.yml 负责 Cloudflare 路径。两者可独立触发，实现「Cloudflare + Linux 双部署」。
# README「GitHub Actions self-hosted Runner deployment」章节描述的即本工作流。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # 仅当 Node 后端或其依赖变化时才触发 Linux 部署，避免每次改 SDK/web 都重部 Linux。
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'ecosystem.config.cjs'
      - '.github/workflows/deploy-node.yml'

concurrency:
  group: web-collection-node
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, web-collection]
    environment: production
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/web-collection' }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8787/health' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy release
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v pm2 >/dev/null || { echo 'pm2 is required on the runner'; exit 1; }
          test -f "$DEPLOY_ROOT/shared/.env" || { echo "$DEPLOY_ROOT/shared/.env is missing"; exit 1; }

          release="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          previous="$(readlink -f "$DEPLOY_ROOT/current" 2>/dev/null || true)"
          mkdir -p "$release"
          cp -a dist/. "$release/"
          ln -sfn "$DEPLOY_ROOT/shared/.env" "$release/.env"

          cd "$release"
          pnpm install --prod --frozen-lockfile
          ln -sfn "$release" "$DEPLOY_ROOT/current"

          rollback() {
            if [[ -n "$previous" && -d "$previous" ]]; then
              ln -sfn "$previous" "$DEPLOY_ROOT/current"
              cd "$previous"
              pm2 startOrReload ecosystem.config.cjs --env production
            fi
          }
          trap rollback ERR

          cd "$DEPLOY_ROOT/current"
          pm2 startOrReload ecosystem.config.cjs --env production
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error "$HEALTH_URL" && break
            [[ "$attempt" -eq 15 ]] && exit 1
            sleep 2
          done
          pm2 save
          trap - ERR

          # 保留最近 5 个 release，更老的清理
          ls -1dt "$DEPLOY_ROOT"/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
