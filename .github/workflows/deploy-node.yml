name: Deploy Node (self-hosted)

# Node + PostgreSQL 后端（apps/api）部署到 self-hosted runner。
# 跨平台：Windows runner（Git Bash）与 Linux runner 均可。与部署 Cloudflare Worker 的
# deploy.yml 解耦，实现「Cloudflare + Linux/Windows 服务器」双部署。
# 依赖：runner 需预装 Node.js、pnpm、pm2、curl；并准备好 $DEPLOY_ROOT/shared/.env（PG 凭据等）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # 仅当 Node 后端或其依赖变化时才触发，避免每次改 SDK/web 都重部 Linux。
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'ecosystem.config.cjs'
      - '.github/workflows/deploy-node.yml'

concurrency:
  group: web-collection-node
  # true：新 push 触发的新 run 会自动取消卡在 queued/pending 的旧 run，
  # 避免某个因 runner 会话失活而卡住的 run 长期占组、阻塞后续部署。
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # 匹配本机 Windows self-hosted runner（labels=self-hosted,Windows,X64）。
    # 若后续注册 Linux runner，可改为 [self-hosted, linux, X64] 或加自定义标签。
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      # 仓库 Settings → Variables 可设 DEPLOY_ROOT 覆盖；未设时脚本按 OS 选默认路径。
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8787/health' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy release
        shell: bash
        run: |
          set -Eeuo pipefail

          # OS 感知的默认部署根目录（Windows Git Bash 用 $HOME 下目录，Linux 用 /opt）。
          # 优先用仓库变量 DEPLOY_ROOT 覆盖。
          if [ -z "${DEPLOY_ROOT:-}" ]; then
            case "$(uname -s)" in
              MINGW*|MSYS*|CYGWIN*) DEPLOY_ROOT="$HOME/web-collection" ;;
              *) DEPLOY_ROOT="/opt/web-collection" ;;
            esac
          fi
          echo "DEPLOY_ROOT=$DEPLOY_ROOT"

          command -v pm2 >/dev/null || { echo 'pm2 is required on the runner'; exit 1; }
          ENV_FILE="$DEPLOY_ROOT/shared/.env"
          test -f "$ENV_FILE" || { echo "$ENV_FILE is missing — put your PostgreSQL/env config there first"; exit 1; }

          RELEASE="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          CURRENT="$DEPLOY_ROOT/current.txt"          # 用文件而非软链跟踪当前版本（Windows 软链需管理员）
          PREVIOUS="$(cat "$CURRENT" 2>/dev/null || true)"

          mkdir -p "$RELEASE"
          cp -r dist/. "$RELEASE/"
          cp "$ENV_FILE" "$RELEASE/.env"

          cd "$RELEASE"
          pnpm install --prod --frozen-lockfile
          echo "$RELEASE" > "$CURRENT"

          rollback() {
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              echo "$PREVIOUS" > "$CURRENT"
              cd "$PREVIOUS"
              pm2 startOrReload ecosystem.config.cjs --env production
            fi
          }
          trap rollback ERR

          cd "$RELEASE"
          pm2 startOrReload ecosystem.config.cjs --env production
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error "$HEALTH_URL" && break
            [ "$attempt" -eq 15 ] && { echo "health check failed after 15 attempts"; exit 1; }
            sleep 2
          done
          pm2 save
          trap - ERR

          # 保留最近 5 个 release，更老的清理（用 while read 替代 xargs -r，兼容 Git Bash）。
          ls -1dt "$DEPLOY_ROOT"/releases/* 2>/dev/null | tail -n +6 | while read -r old; do rm -rf "$old"; done
          echo "Deployed $RELEASE"
