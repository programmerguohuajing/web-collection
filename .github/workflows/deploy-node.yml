name: Deploy Node (self-hosted)

# Node + PostgreSQL 后端（apps/api）部署到 self-hosted runner。
# 当前面向 Windows runner（用 Windows PowerShell）。与部署 Cloudflare Worker 的 deploy.yml 解耦，
# 实现「Cloudflare + Linux/Windows 服务器」双部署。
# 依赖：runner 需预装 Node.js、pnpm、pm2；并准备好 $DEPLOY_ROOT/shared/.env（PG 凭据等）。
# Linux runner：需装 PowerShell Core(pwsh) 并把 defaults.run.shell 改为 pwsh。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # 仅当 Node 后端或其依赖变化时才触发，避免每次改 SDK/web 都重部。
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'ecosystem.config.cjs'
      - '.github/workflows/deploy-node.yml'

concurrency:
  group: web-collection-node
  # true：新 run 自动取消卡在 queued/pending 的旧 run，避免会话失活的 run 占组阻塞后续。
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # 匹配本机 Windows self-hosted runner（labels=self-hosted,Windows,X64）。
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    # Windows 上 PATH 里 C:\Windows\System32\bash.exe（WSL stub）会屏蔽 Git Bash，
    # 导致 shell: bash 误用 WSL → "execvpe(/bin/bash) failed"。改用 Windows PowerShell（系统自带）。
    defaults:
      run:
        shell: powershell
    env:
      # 仓库 Settings → Variables 可设 DEPLOY_ROOT 覆盖；未设时脚本按 OS 选默认路径。
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'http://127.0.0.1:8787/health' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy release
        run: |
          $ErrorActionPreference = 'Stop'

          # OS 感知的默认部署根目录（Windows 用 $HOME 下，Linux 用 /opt）。优先用仓库变量覆盖。
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ROOT)) {
            if ($env:RUNNER_OS -eq 'Windows') { $env:DEPLOY_ROOT = Join-Path $env:USERPROFILE 'web-collection' }
            else { $env:DEPLOY_ROOT = '/opt/web-collection' }
          }
          Write-Host "DEPLOY_ROOT=$($env:DEPLOY_ROOT)"

          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) { throw 'pm2 is required on the runner' }
          $envFile = Join-Path $env:DEPLOY_ROOT 'shared\.env'
          if (-not (Test-Path $envFile)) { throw "$envFile is missing — put PostgreSQL/env config there first" }

          $release = Join-Path $env:DEPLOY_ROOT "releases\$env:GITHUB_SHA"
          $currentFile = Join-Path $env:DEPLOY_ROOT 'current.txt'
          $previous = if (Test-Path $currentFile) { (Get-Content $currentFile -Raw).Trim() } else { '' }

          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item -Recurse -Force 'dist\*' $release
          Copy-Item $envFile (Join-Path $release '.env')

          Push-Location $release
          try {
            pnpm install --prod --frozen-lockfile
            Set-Content -Path $currentFile -Value $release

            pm2 startOrReload (Join-Path $release 'ecosystem.config.cjs') --env production
            $ok = $false
            for ($i = 1; $i -le 15; $i++) {
              try { Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 5 | Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ok) { throw "health check failed after 15 attempts ($env:HEALTH_URL)" }
            pm2 save
          } catch {
            Write-Host "Deploy failed, rolling back: $_"
            if ($previous -and (Test-Path $previous)) {
              Set-Content -Path $currentFile -Value $previous
              Push-Location $previous
              pm2 startOrReload (Join-Path $previous 'ecosystem.config.cjs') --env production
              Pop-Location
            }
            throw
          } finally {
            Pop-Location
          }

          # 保留最近 5 个 release，更老的清理。
          Get-ChildItem -Path (Join-Path $env:DEPLOY_ROOT 'releases') -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 |
            Remove-Item -Recurse -Force
          Write-Host "Deployed $release"
