name: Release SDK to npm

# 架构约定：tag 是唯一真相源。
# 一次发布必须由推送 `vX.Y.Z` 版本 tag 触发，工作流在同一流程里完成
# 「校验版本 → 发布 npm → 建 GitHub Release → 上传 SDK tgz」。
# 这样 npm 版本、git tag、GitHub Release、Release 上的 tgz 四者永远一致，
# 不会再出现“npm 发了但没打 tag / 没建 Release / Release 没带 tgz”的漂移。
# （历史上曾保留 workflow_dispatch 走 main 直接发、且缺少打包上传 tgz 步骤，
#   导致 0.1.7 之后多个 release 缺 tgz。）
on:
  push:
    tags:
      - 'v*.*.*'
  # 允许在 Actions 标签页手动触发「Run workflow」，作为 tag 重建不一定重跑时的兜底。
  workflow_dispatch:

permissions:
  contents: write   # 创建 GitHub Release / 上传 asset 需要写权限

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 便于 gh 基于历史生成 Release notes

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # pnpm@11.7.0 要求 Node >=22.13 且依赖 node:sqlite；Node 20 会直接崩溃
          registry-url: 'https://registry.npmjs.org'

      # 必须与仓库 packageManager(pnpm@11.7.0) 对齐：lockfile 为 v9 格式，
      # pnpm@7(v6) 无法正确校验改过依赖的包（如 sdk-react-native 的 ^0.5.0），
      # frozen-lockfile 安装会报 ERR_PNPM_OUTDATED_LOCKFILE。
      # 同时 Node 必须 >=22.13（见上方 node-version），否则 pnpm 启动即报
      # ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite。
      - name: Install pnpm (match packageManager 11.7.0)
        run: npm install -g pnpm@11.7.0

      - name: Install SDK dependencies (package-only)
        run: pnpm --filter @web-collection/sdk install --workspace-root=false

      - name: Build SDK
        run: pnpm --filter @web-collection/sdk build

      # tag 必须携带版本号（vX.Y.Z），且必须与 package.json 的 version 一致。
      - name: Verify tag matches package version
        id: target
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (v$tag_version) does not match package version v$package_version"
            exit 1
          fi

      # Next Horizon E4/E1 补齐：发版时把 SDK 体积（gzip / raw / min）上报到 /api/sdk-size，
      # 使 sdk-health 页「SDK 体积开销」卡片在发版后自动有真实数据。
      #
      # ⚠️ 依赖顺序（关键，曾踩坑）：本步骤必须排在 `id: target` 之后。
      # 历史 bug：本步骤原本位于「Verify tag matches package version」之前，而它却引用
      # steps.target.outputs.package_version —— 此时 target 尚未运行，展开为空串，
      # worker 侧 `if (!body.version) return 400 missing version` 直接拒绝；
      # 再叠加 continue-on-error，失败完全静默，导致 sdk-health 页长期显示「CI 未上报」。
      #
      # best-effort：失败仅告警不阻断发版；worker 未配置 CI_REPORT_TOKEN 时该接口开放写入。
      # dist 在上游「Build SDK」步骤已产出，此处只读取不构建。
      - name: Report SDK size to monitoring endpoint
        id: sdksize
        if: always() && steps.target.conclusion == 'success'
        continue-on-error: true
        env:
          SDK_SIZE_ENDPOINT: https://web-collection.jingguohua.cc.cd/api/sdk-size
          SDK_SIZE_REPORT_TOKEN: ${{ secrets.SDK_SIZE_REPORT_TOKEN }}
          TARGET_VERSION: ${{ steps.target.outputs.package_version }}
        shell: bash
        run: |
          node -e '
            const fs=require("fs"); const zlib=require("zlib"); const path=require("path");
            const dir="packages/sdk/dist";
            const version=process.env.TARGET_VERSION||"";
            if(!version){ console.log("::warning::skip SDK size report: empty version"); process.exit(1); }
            if(!fs.existsSync(dir)){ console.log("::warning::skip SDK size report: dist not built"); process.exit(1); }
            const files=fs.readdirSync(dir);
            const iife=files.find(f=>f.endsWith(".iife.js") && !f.endsWith(".min.js"));
            if(!iife){ console.log("::warning::skip SDK size report: no iife bundle in dist"); process.exit(1); }
            const raw=fs.readFileSync(path.join(dir,iife));
            const gz=zlib.gzipSync(raw,{level:9}).length;
            // min 列：vite.iife.config.js 已开启 minify:'terser'，iife 产物本身就是压缩后的，
            // 因此不存在独立的 .iife.min.js —— min 与该产物同源（同为 raw.length）。
            // 兼容：若未来额外产出 .iife.min.js，则优先取它，不会误报。
            const minName=files.find(f=>f.endsWith(".iife.min.js"));
            const min=minName?fs.readFileSync(path.join(dir,minName)).length:raw.length;
            const body=JSON.stringify({
              version,
              gzBytes:gz,
              rawBytes:raw.length,
              minBytes:min,
              ciRun:process.env.GITHUB_RUN_ID||null
            });
            const token=process.env.SDK_SIZE_REPORT_TOKEN||"";
            const headers={"content-type":"application/json"};
            if(token) headers["x-ci-token"]=token;
            (async()=>{
              try{
                const r=await fetch(process.env.SDK_SIZE_ENDPOINT,{method:"POST",headers,body});
                const text=await r.text().catch(()=>"");
                console.log(`report sdk size: version=${version} gz=${gz} raw=${raw.length} min=${min} -> http ${r.status} ${text.slice(0,200)}`);
                if(!r.ok){ console.log("::warning::SDK size report rejected: http "+r.status); process.exit(1); }
              }catch(e){
                console.log("::warning::SDK size report error: "+e.message);
                process.exit(1);
              }
            })();
          '

      # 幂等保护：若版本已存在于 npm，则跳过发布（兼容重跑 / 重复打 tag）。
      - name: Check npm version already published
        id: npmcheck
        shell: bash
        run: |
          version="${{ steps.target.outputs.package_version }}"
          exists="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@web-collection/sdk/$version" || true)"
          if [ "$exists" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Version $version already exists on npm — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

      - name: Publish SDK
        id: publish
        if: steps.npmcheck.outputs.skip != 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
        run: pnpm publish --no-git-checks --access public

      # ---- Next Horizon E4/E1：同步发布 sdk-react-native 与 sdk-electron ----
      # 这两个包各自走独立版本线（当前 0.1.0），不与主 sdk 的 0.5.0 强绑定；
      # tag 校验（Verify 步骤）仅针对主 sdk，下面的发布按各自 package.json 版本走，
      # 幂等保护各自独立。dist 已被 gitignore，发布前必须在本工作流内 build。
      - name: Install sdk-react-native dependencies
        run: pnpm --filter @web-collection/sdk-react-native install --workspace-root=false

      - name: Build sdk-react-native
        run: pnpm --filter @web-collection/sdk-react-native build

      - name: Check sdk-react-native version already published
        id: rncheck
        shell: bash
        run: |
          version="$(node -p "require('./packages/sdk-react-native/package.json').version")"
          exists="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@web-collection/sdk-react-native/$version" || true)"
          if [ "$exists" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Version $version already exists on npm — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish sdk-react-native
        if: steps.rncheck.outputs.skip != 'true'
        working-directory: packages/sdk-react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
        run: pnpm publish --no-git-checks --access public

      - name: Install sdk-electron dependencies
        run: pnpm --filter @web-collection/sdk-electron install --workspace-root=false

      - name: Build sdk-electron
        run: pnpm --filter @web-collection/sdk-electron build

      - name: Check sdk-electron version already published
        id: electroncheck
        shell: bash
        run: |
          version="$(node -p "require('./packages/sdk-electron/package.json').version")"
          exists="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@web-collection/sdk-electron/$version" || true)"
          if [ "$exists" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Version $version already exists on npm — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish sdk-electron
        if: steps.electroncheck.outputs.skip != 'true'
        working-directory: packages/sdk-electron
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
        run: pnpm publish --no-git-checks --access public

      # 建 GitHub Release。Release 说明从 CHANGELOG.md 抽取本版本章节（--notes-file），
      # 而非仅 --generate-notes 生成的 "Full Changelog: vX.Y.Z...vX.Y.Z" 占位。
      # 抽取逻辑：从 "## [<version>]" 行起、到下一个 "## [" 行之前，写入 release-notes.md；
      # 若该章节为空（CHANGELOG 未补该版本），回退 --generate-notes 以保证 Release 仍创建。
      # 两种情况都建：① npm 已存在（跳过发布，补建 Release）；② npm 发布成功。
      # 若 npm 发布失败，则不建 Release，避免“发了 Release 却没上 npm”。
      # 注意：必须用 always() 包裹，否则当表达式引用了被条件跳过的步骤上下文时，
      # GitHub 会把整个 if 视为求值失败而静默 SKIP（曾导致 0.2.4 的 Release 未创建）。
      # 用 conclusion 而非 result：publish 被自身 if 跳过时 conclusion=skipped，仍 != failure。
      - name: Create GitHub Release
        id: release
        if: always() && steps.publish.conclusion != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.target.outputs.package_version }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — will upload tgz to existing release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # 从 CHANGELOG.md 抽取本版本章节作为 Release 说明（点号用 [.] 作字面量，避免 awk 转义告警）
            v_esc="$(printf '%s' "$version" | sed 's/[.]/[.]/g')"
            awk -v v="$v_esc" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "^## \\[" v "\\]") { found=1; print; next }
              }
              found { print }
            ' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then
              gh release create "v$version" --notes-file release-notes.md --title "v$version"
            else
              echo "::warning::CHANGELOG.md 未找到 v$version 章节，回退 --generate-notes"
              gh release create "v$version" --generate-notes --title "v$version"
            fi
          fi

      # 打包 SDK 为 tgz 并作为 Release asset 上传。
      # 命名沿用历史风格（v0.1.5/6/7 为 web-collection-sdk-{ver}.tgz），保持前后一致。
      # 放在建 Release 之后上传，确保重试安全（release 已存在则仅追加 asset）。
      - name: Pack and upload SDK tgz
        if: always() && steps.release.conclusion != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.target.outputs.package_version }}"
          tgz="web-collection-sdk-${version}.tgz"
          (cd packages/sdk && pnpm pack)
          mv "packages/sdk/${tgz}" "$tgz"
          # 若该 asset 已存在则先删后传，避免重复上传报错
          if gh release view "v$version" --json assets --jq ".assets[].name" | grep -qx "$tgz"; then
            gh release delete-asset "v$version" "$tgz" -y || true
          fi
          gh release upload "v$version" "$tgz" --clobber
