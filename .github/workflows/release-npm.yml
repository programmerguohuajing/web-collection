name: Release SDK to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @web-collection/sdk test
      - run: pnpm --filter @web-collection/sdk build
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Publish SDK
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
        working-directory: packages/sdk
        run: npm publish --access public
