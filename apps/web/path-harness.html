<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>访问页面列 · 设计验证</title>
  <link rel="stylesheet" href="/node_modules/element-plus/dist/index.css" />
  <style>
    body { padding: 24px; font-family: var(--el-font-family); background: #f5f7fa; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h2 { margin: 0 0 4px; }
    .sub { color: #909399; font-size: 13px; margin-bottom: 16px; }
    .note { font-size: 12px; color: #909399; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>会话列表 · 访问页面列（新版）</h2>
    <div class="sub">面包屑前 N 页 + 「+N 页」行内展开（element-plus expand 行）</div>
    <div id="app"></div>
    <div class="note">点击「+N 页」在行下方展开完整路径，再次点击收起；点击行空白处可模拟打开会话抽屉（此处仅打印）。</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "vue": "/node_modules/vue/dist/vue.esm-browser.js"
      }
    }
  </script>
  <script type="module">
    import { createApp, ref } from 'vue'
    import ElementPlus from '/node_modules/element-plus/dist/index.full.mjs'
    import zhCn from '/node_modules/element-plus/es/locale/lang/zh-cn.mjs'
    import { ArrowDown, ArrowRight, ArrowUp } from '/node_modules/@element-plus/icons-vue/dist/index.js'

    const PATH_PREVIEW = 3

    const rows = ref([
      { session_id: 's-001', user_name: '张三', event_count: 42, error_count: 1,
        paths: ['/home', '/products', '/product/abc', '/cart', '/checkout', '/order/success', '/order/detail'] },
      { session_id: 's-002', user_name: '李四', event_count: 8, error_count: 0,
        paths: ['/login'] },
      { session_id: 's-003', user_name: '王五', event_count: 21, error_count: 2,
        paths: ['/home', '/search?q=手机&page=2&sort=price&x=long-category-name-very-long-long-long', '/product/xyz', '/cart', '/checkout'] },
      { session_id: 's-004', user_name: '赵六', event_count: 3, error_count: 0, paths: [] },
    ])

    const tableRef = ref(null)
    const expandedRowKeys = ref(new Set())

    function visiblePaths(row) { return row.paths.slice(0, PATH_PREVIEW) }
    function rowExpanded(row) { return expandedRowKeys.value.has(row.session_id) }
    function toggleExpand(row) { tableRef.value?.toggleRowExpansion(row) }
    function onExpandChange(row, expandedRows) {
      const set = new Set(expandedRowKeys.value)
      if (expandedRows.some(i => i.session_id === row.session_id)) set.add(row.session_id)
      else set.delete(row.session_id)
      expandedRowKeys.value = set
    }
    function onRowClick(row) { window.clickLog = (window.clickLog||0)+1; console.log('row click:', row.session_id) }

    createApp({
      components: { ArrowDown, ArrowRight, ArrowUp, ElTable: ElementPlus.ElTable, ElTableColumn: ElementPlus.ElTableColumn, ElIcon: ElementPlus.ElIcon },
      setup() { return { rows, tableRef, PATH_PREVIEW, visiblePaths, rowExpanded, toggleExpand, onExpandChange, onRowClick } },
      template: `
        <el-table ref="tableRef" :data="rows" border :row-key="r=>r.session_id" @row-click="onRowClick" @expand-change="onExpandChange" style="cursor:pointer">
          <el-table-column type="expand" width="24">
            <template #default="{ row }">
              <div class="path-expand">
                <div class="path-expand-title">完整访问路径（共 {{ row.paths.length }} 页）</div>
                <div class="path-expand-body">
                  <template v-for="(p, i) in row.paths" :key="i">
                    <span class="path-crumb">{{ p }}</span>
                    <el-icon v-if="i < row.paths.length - 1" class="path-crumb-arrow"><ArrowRight /></el-icon>
                  </template>
                </div>
              </div>
            </template>
          </el-table-column>
          <el-table-column label="会话 ID" min-width="200"><template #default="{ row }">{{ row.session_id }}</template></el-table-column>
          <el-table-column label="用户名称" width="120"><template #default="{ row }">{{ row.user_name }}</template></el-table-column>
          <el-table-column label="事件数" width="90" align="center"><template #default="{ row }">{{ row.event_count }}</template></el-table-column>
          <el-table-column label="错误数" width="90" align="center"><template #default="{ row }"><el-tag v-if="row.error_count" type="danger" size="small">{{ row.error_count }}</el-tag><span v-else>-</span></template></el-table-column>
          <el-table-column label="访问页面" min-width="240" cell-class-name="no-ellipsis">
            <template #default="{ row }">
              <span v-if="row.paths.length" class="path-cell">
                <template v-for="(p, i) in visiblePaths(row)" :key="i">
                  <span class="path-crumb" :title="p">{{ p }}</span>
                  <el-icon v-if="i < visiblePaths(row).length - 1" class="path-crumb-arrow"><ArrowRight /></el-icon>
                </template>
                <span v-if="row.paths.length > PATH_PREVIEW" class="path-toggle" :class="{ 'is-expanded': rowExpanded(row) }" @click.stop="toggleExpand(row)">
                  +{{ row.paths.length - PATH_PREVIEW }} 页
                  <el-icon class="path-toggle-arrow"><ArrowDown v-if="!rowExpanded(row)" /><ArrowUp v-else /></el-icon>
                </span>
              </span>
              <span v-else>-</span>
            </template>
          </el-table-column>
        </el-table>
      `,
    }).use(ElementPlus, { locale: zhCn }).mount('#app')
  </script>

  <style>
    .no-ellipsis { overflow: visible !important; text-overflow: clip !important; white-space: normal !important; }
    .el-table__expand-icon { display: none !important; }
    .el-table .el-table__expand-column .cell { padding: 0 !important; }
    .path-cell { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; max-width: 100%; }
    .path-crumb { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--el-text-color-primary); }
    .path-crumb-arrow { flex: none; color: var(--el-text-color-placeholder); font-size: 12px; }
    .path-toggle { display: inline-flex; align-items: center; gap: 2px; flex: none; margin-left: 2px; color: var(--el-color-primary); cursor: pointer; font-size: 12px; user-select: none; }
    .path-toggle:hover { color: var(--el-color-primary-light-3); }
    .path-toggle-arrow { font-size: 12px; transition: transform .2s; }
    .path-toggle.is-expanded .path-toggle-arrow { transform: rotate(180deg); }
    .path-expand { padding: 4px 8px; font-size: 13px; }
    .path-expand-title { font-weight: 600; margin-bottom: 8px; color: var(--el-text-color-primary); }
    .path-expand-body { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; line-height: 1.7; }
    .path-expand-body .path-crumb { max-width: 220px; }
    .path-expand-body .path-crumb-arrow { color: var(--el-color-primary); }
  </style>
</body>
</html>
